name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements-dev.txt
      - name: Install dev dependencies
        run: uv pip install --system -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Unit tests
        run: python -m pytest

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint deploy/helm/ai-models
      - name: Render chart
        run: helm template ai-models deploy/helm/ai-models > /dev/null
