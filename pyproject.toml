# Tool configuration only (no packaging).
# Dotted keys are used instead of table headers on purpose.

tool.ruff.line-length = 120
tool.ruff.target-version = "py313"
tool.ruff.extend-exclude = ["results", "data", "mlruns", "outputs"]

# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear, UP: pyupgrade
tool.ruff.lint.select = ["E", "W", "F", "I", "B", "UP"]

# The schema is DATA (it generates the JSON schema sent to the model).
# StrEnum would change str()/format() of the members, so (str, Enum) is kept.
tool.ruff.lint.per-file-ignores."src/schemas/extraction.py" = ["UP042"]

tool.pytest.ini_options.testpaths = ["tests"]
tool.pytest.ini_options.pythonpath = ["."]
tool.pytest.ini_options.addopts = "-q"
